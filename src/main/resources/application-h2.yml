spring:
  datasource:
    url: jdbc:h2:mem:resource_booking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: H2LocalDevOnlySecretKeyThatIsAtLeast32BytesLong!!

app:
  seed:
    enabled: true
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    user-password: ${SEED_USER_PASSWORD:User@123}
