spring:
  datasource:
    url: jdbc:h2:mem:resource_booking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: TestOnlySecretKeyThatIsAtLeastThirtyTwoBytesLong!!
  expiration-ms: 3600000

# Satisfies ${JWT_SECRET} from the main application.yml during tests
JWT_SECRET: TestOnlySecretKeyThatIsAtLeastThirtyTwoBytesLong!!
